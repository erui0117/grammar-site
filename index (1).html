<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 문법 마당</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a3d8f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="문법 마당">
<meta name="description" content="고등 국어 문법 개념 정리, 단원별 퀴즈, 기출 자료실">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 쪽빛(indigo) 잉크와 인주(seal red) 하나: 교과서 여백처럼 조용한 바탕 위에 단원색 띠로 길을 찾는 구성 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#161b2e; --muted:#5a6276; --line:#dde1ea;
  --accent:#2a3d8f; --seal:#c23b26; --soft:rgba(42,61,143,.07);
  --u1:#2a3d8f; --u2:#1d7466; --u3:#a8711a; --u4:#74479e; --u5:#c23b26;
  --t-sub:#2a3d8f; --t-del:#c23b26; --t-add:#1d7466; --t-con:#a8711a;
  --display:"Hahmlet","Noto Serif KR","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --old:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Serif CJK KR","Source Han Sans K",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --surface:#191d28; --ink:#e8eaf0; --muted:#9aa2b5; --line:#2b3142;
    --accent:#9badff; --seal:#ff7c62; --soft:rgba(155,173,255,.09);
    --u1:#9badff; --u2:#5cc9b6; --u3:#e3b257; --u4:#c49cf0; --u5:#ff7c62;
    --t-sub:#9badff; --t-del:#ff7c62; --t-add:#5cc9b6; --t-con:#e3b257;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#191d28; --ink:#e8eaf0; --muted:#9aa2b5; --line:#2b3142;
  --accent:#9badff; --seal:#ff7c62; --soft:rgba(155,173,255,.09);
  --u1:#9badff; --u2:#5cc9b6; --u3:#e3b257; --u4:#c49cf0; --u5:#ff7c62;
  --t-sub:#9badff; --t-del:#ff7c62; --t-add:#5cc9b6; --t-con:#e3b257;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
.old{font-family:var(--old)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.seal{width:32px;height:32px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;transform:rotate(-4deg)}
.brand b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;padding:6px 11px;border-radius:8px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--c,var(--accent))}
.dict{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 10px}
.dict input{border:0;background:transparent;width:130px;outline:none;font-size:14px}
.dict a{font-size:13px;font-weight:600;text-decoration:none;background:#03c75a;color:#fff;padding:5px 10px;border-radius:7px;white-space:nowrap}
@media (max-width:860px){.top-in{flex-wrap:wrap;gap:8px 12px}.dict{order:2;margin-left:auto}nav.tabs{order:3;flex-basis:100%}}
@media (max-width:420px){.dict input{width:96px}}

main{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 40%,var(--line))}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;margin-bottom:36px}
.hero h1{font-size:clamp(32px,4.6vw,50px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--seal)}
.hero p{color:var(--muted);max-width:34em;margin:14px 0 0}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;position:relative;overflow:hidden}
.demo-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
.chain{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 2px;min-height:118px;transition:opacity .35s}
.chain.fade{opacity:0}
.form{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.01em;padding:2px 8px;border-radius:8px;color:var(--muted);transition:color .3s,background .3s}
.form.on{color:var(--ink);background:var(--soft)}
.form.final{color:var(--seal)}
.arrow{display:flex;flex-direction:column;align-items:center;padding-top:10px;min-width:54px}
.arrow i{font-style:normal;color:var(--muted);font-size:20px;line-height:1}
.arrow small{font-size:11px;font-weight:600;line-height:1.3;text-align:center;max-width:84px;margin-top:4px;color:var(--tc,var(--muted))}
.demo-foot{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.demo-foot button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.demo-foot button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}

/* home units */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 14px}
.sec-h h2{font-size:22px}
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c);transition:transform .15s}
.ucard:hover{transform:translateY(-2px)}
.ucard .n{font-family:var(--display);font-weight:800;color:var(--c);font-size:14px}
.ucard h3{font-size:20px}
.ucard p{margin:0;font-size:14px;color:var(--muted);line-height:1.55;flex:1}
.ucard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
@media (max-width:1000px){.units{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.units{grid-template-columns:1fr}}
.home-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:28px}
@media (max-width:860px){.home-row{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:18px;margin-bottom:10px}

/* unit */
.uhead{border-left:5px solid var(--c);padding:4px 0 4px 18px;margin-bottom:26px}
.uhead h1{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.02em}
.uhead p{margin:6px 0 10px;color:var(--muted);max-width:44em}
.ulayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;font-size:14px;max-height:calc(100vh - 96px);overflow:auto}
.toc a{text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:7px;display:flex;gap:8px;line-height:1.45}
.toc a span{font-family:var(--display);font-weight:700;color:var(--c);flex:none;width:20px}
.toc a:hover{background:var(--soft);color:var(--ink)}
@media (max-width:860px){.ulayout{grid-template-columns:1fr}.toc{position:static;flex-direction:row;overflow-x:auto;max-height:none}.toc a{flex:none;background:var(--surface);border:1px solid var(--line)}}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px;scroll-margin-top:80px}
.topic>h2{font-size:22px;display:flex;gap:12px;align-items:baseline;margin-bottom:10px}
.topic>h2 span{font-weight:800;color:var(--c);font-size:16px}
.topic h4{font-size:16px;margin:20px 0 6px;color:var(--ink)}
.topic p,.topic ul{margin:8px 0;max-width:70ch}
.topic ul{padding-left:20px}
.topic li{margin:3px 0}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;margin:10px 0;font-size:14.5px;width:100%;line-height:1.55}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left}
.tbl th{background:var(--soft);font-weight:600;white-space:nowrap}
.tbl.center td,.tbl.center th{text-align:center;vertical-align:middle}
.tbl.center td{font-size:17px}
.ex{background:var(--soft);border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.8}
.tip{border-left:3px solid var(--seal);padding:6px 12px;margin:10px 0;font-size:14.5px;color:var(--muted);line-height:1.65}
.tip b{color:var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}}
.kcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;line-height:1.4;gap:2px}
.kcard b{font-family:var(--display);font-size:17px}
.kcard span{font-size:13px;color:var(--muted)}
.kcard em{font-style:normal;font-weight:700;color:var(--seal);font-size:14px}
.timeline{display:grid;gap:0;margin:12px 0;border-left:2px solid var(--line);padding-left:18px}
.timeline>div{position:relative;padding:6px 0 12px;display:flex;flex-direction:column;line-height:1.5}
.timeline>div::before{content:"";position:absolute;left:-25px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.timeline b{font-family:var(--display);font-size:17px}
.timeline small{color:var(--muted)}
a.w{color:inherit;text-decoration:underline;text-decoration-color:#03c75a;text-decoration-thickness:2px;text-underline-offset:3px}
a.w:hover{background:rgba(3,199,90,.12)}

/* widgets */
.wg{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:12px 0}
.wg-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.wg-pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:15px}
.wg-pick button.on{background:var(--c);border-color:var(--c);color:var(--surface)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--soft)}
.step .f{font-family:var(--display);font-weight:700;font-size:22px}
.step .r{font-size:14px}
.step .r b{color:var(--tc)}
.step .cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:520px){.step{grid-template-columns:1fr auto}.step .r{grid-column:1/-1;order:3}}
.mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mc{border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:600;background:var(--surface);line-height:1.4;text-align:center}
.mc small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.mc.a{border-color:var(--u2);box-shadow:inset 0 -3px 0 var(--u2)}
.mc.b{border-color:var(--u3);box-shadow:inset 0 -3px 0 var(--u3)}
.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.mtabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;cursor:pointer;font-size:13.5px}
.mtabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sent{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sent button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:64px;line-height:1.35}
.sent button b{font-family:var(--display);font-size:20px}
.sent button small{font-size:12.5px;font-weight:600;color:transparent;min-height:1.3em}
.sent button.show small{color:var(--c)}
.sent button.show{border-color:var(--c)}

/* archive */
.arch-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.arch-h h1{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.02em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:14px}
.filters input{flex:1;min-width:160px}
.ufilter{display:flex;gap:4px;flex-wrap:wrap}
.ufilter button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13.5px;cursor:pointer;font-weight:600}
.ufilter button.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--surface)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.qitem:hover{border-color:var(--c)}
.qitem .src{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.3;min-width:96px;font-variant-numeric:tabular-nums}
.qitem .src small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:12.5px}
.qitem .tt{font-weight:600;line-height:1.45}
.qitem .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.qitem .tags .chip{font-size:12px;font-weight:500}
.qitem .att{font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.qitem{grid-template-columns:1fr}.qitem .att{display:none}}
.state{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center;background:var(--surface)}
.example-badge{font-size:11.5px;font-weight:700;color:var(--seal);border:1px solid var(--seal);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}

/* notes */
.notes{margin-top:26px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.note h4{font-size:17px;margin:0 0 4px}
.note .body{white-space:normal}
.row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;padding:22px 24px;position:relative;border:1px solid var(--line)}
.modal h2{font-size:22px;margin-bottom:6px;padding-right:40px}
.xbtn{position:absolute;top:14px;right:14px;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:15px}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.frow{grid-template-columns:1fr 1fr}}
.dsec{margin:14px 0}
.dsec h4{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:4px}
.dsec .txt{white-space:normal;line-height:1.8}
.choices{margin:0;padding-left:0;list-style:none}
.choices li{padding:3px 0}
.attach{display:flex;flex-direction:column;gap:10px}
.attach img{max-width:100%;border:1px solid var(--line);border-radius:10px}
.files-edit{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.files-edit div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;background:var(--soft);border-radius:8px;padding:4px 10px}
.err{color:var(--seal);font-size:14px;margin:6px 0}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--seal) 10%,transparent);border-radius:10px;padding:8px 12px;font-size:14px}

.more{border-top:1px dashed var(--line);margin-top:20px;padding-top:4px}
.more-h{display:inline-block;font-size:12.5px;font-weight:700;color:var(--c);background:var(--soft);border-radius:6px;padding:1px 8px;margin-top:12px}
.more h4:first-of-type{margin-top:10px}
.quiz{border:1px solid var(--line);border-radius:12px;padding:16px}
.qz-top{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qz-bar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.qz-q{font-weight:600;font-size:17px;margin:14px 0 10px!important}
.qz-c{display:flex;flex-direction:column;gap:6px}
.qz-c button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.55}
.qz-c button:hover:not(:disabled){border-color:var(--c)}
.qz-c button b{color:var(--c);flex:none}
.qz-c button.ok{border-color:var(--t-add);background:color-mix(in srgb,var(--t-add) 12%,transparent)}
.qz-c button.no{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 10%,transparent)}
.qz-c button.dim{opacity:.55}
.qz-c button:disabled{cursor:default;color:var(--ink)}
.qz-e{border-left:3px solid var(--t-add);padding:8px 12px;margin:12px 0 4px;font-size:15px;line-height:1.7}
.qz-e.no{border-color:var(--seal)}
.qz-res{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.qz-res b{font-family:var(--display);font-size:40px;color:var(--c);font-variant-numeric:tabular-nums}
.qz-w{border-top:1px solid var(--line);padding-top:6px;font-size:15px}
.qz-w p{margin:4px 0!important}
#editbar{position:sticky;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--surface);padding:10px 20px;font-size:14px}
#editbar .btn{border-color:transparent}
.sent.wt button:not(.show) small{display:none}

/* 개념 애니메이션 */
.anim{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;margin:0 0 18px;overflow:hidden}

.an-body{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.anim-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.anim-cap b{color:var(--c)}
.an-st{text-align:center;font-size:15px;color:var(--muted);min-height:1.6em}
.an-st.in{animation:anIn .4s ease}

@keyframes anIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.an-row{display:flex;align-items:center;gap:4px}
.an-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.tl{display:inline-grid;place-items:center;width:36px;height:42px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:700;font-size:21px;background:var(--surface);transition:all .45s ease;overflow:hidden;white-space:nowrap}
.tl.hi{border-color:var(--c);background:var(--soft);color:var(--c);transform:translateY(-3px)}
.tl.swap{border-color:var(--t-sub);background:color-mix(in srgb,var(--t-sub) 14%,transparent);color:var(--t-sub);transform:none}
.tl.del{border-color:var(--t-del);color:var(--t-del)}
.tl.add{border-color:var(--t-add);background:color-mix(in srgb,var(--t-add) 14%,transparent);color:var(--t-add)}
.tl.gone{width:0;opacity:0;border-width:0;margin:0 -2px;transform:translateY(14px)}
.tl-sp{width:10px}
.an-eq,.an-plus{font-size:20px;color:var(--muted);font-family:var(--display)}
.an-big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--ink);min-width:80px;text-align:center}
.an-big.pop,.an-word .w.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.an-gloss{font-size:15px;color:var(--muted);min-width:80px}
.an-lane{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:4px 0}
.an-lab{font-weight:700;font-size:14px;color:var(--c)}
.an-lane.f{grid-template-columns:minmax(170px,auto) auto;justify-content:center;gap:24px}
.an-res{font-size:15px;opacity:.35;transition:opacity .4s;white-space:nowrap}
.an-res.done{opacity:1}

.an-stage{display:flex;justify-content:center;min-height:56px;align-items:center;transition:opacity .25s}
.an-stage.fade{opacity:0}
.an-sent{font-family:var(--display);font-size:28px;font-weight:700}
.mt{display:inline-block;padding:5px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:var(--display);font-weight:700;font-size:21px;background:var(--surface);animation:anIn .35s ease}
.mt.sil,.mt.geun{border-color:var(--u2);color:var(--u2)}

.mt.w{border-color:var(--c)}
.lg{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);margin-left:4px}
.lg.sil,.lg.geun,.lg.main{border-color:var(--u2);color:var(--u2)}
.lg.hyeong,.lg.jeop{border:1.5px dashed var(--u3);color:var(--u3)}
.lg.sub{border-color:var(--u4);color:var(--u4)}
.lg.base{border-color:var(--ink)}
.lg.addl{border-color:var(--seal);color:var(--seal)}
.an-legend{display:flex;justify-content:center;gap:6px;margin-top:4px}
.join{gap:12px;transition:gap .5s}

.join.on{gap:0}
.join.on .an-plus{opacity:0;width:0}
.join.on .mt:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.join.on .mt:last-child{border-top-left-radius:0;border-bottom-left-radius:0}
.an-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .4s}
.an-chip b{font-family:var(--display);font-size:22px}
.an-chip small{font-size:13px;font-weight:700;opacity:0;transform:translateY(-4px);transition:all .4s;color:var(--u2)}
.an-chip small.sub{color:var(--u4)}
.an-chip.show{border-color:var(--c)}
.an-chip.show small{opacity:1;transform:none}
.an-line{font-family:var(--display);font-size:22px;font-weight:700;transition:all .5s;padding:6px 12px;border-radius:10px;border:1.5px solid transparent}
.an-line.gone{opacity:0;height:0;padding:0;overflow:hidden;margin:-6px 0}
.an-line.outer{border-color:var(--c);background:var(--soft)}
.an-box{display:inline-block;padding:2px 8px;border:1.5px dashed var(--u3);border-radius:8px}

.slot{transition:all .4s;border-radius:6px;padding:0 4px}
.slot.hi{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.hi2{color:var(--seal);transition:color .4s}
.an-sentence{text-align:center;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.9}
.an-sentence .m{transition:all .35s;border-radius:5px;padding:0 2px}

.an-role{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;transition:all .35s;opacity:.45}
.an-role small{color:var(--muted);font-size:12.5px}
.an-role.on{opacity:1;border-color:var(--c);background:var(--soft)}
.an-chat{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center;max-width:560px;margin:0 auto;width:100%}
.bub{font-size:18px;font-weight:600;padding:9px 14px;border-radius:16px;background:var(--soft);justify-self:start;grid-column:1}

.an-tag{font-size:14px;padding:3px 10px;border-radius:8px;border:1.5px solid var(--line);opacity:0;transform:translateY(-4px);transition:all .4s;justify-self:start;grid-column:1}
.an-tag.show{opacity:1;transform:none}
.an-tag b{color:var(--c)}
.an-chat .t2{border-color:var(--c)}
.win{grid-column:2;grid-row:1/5;width:110px;color:var(--muted)}
.win .pane-r{transition:transform .9s ease}
.win.closed .pane-r{transform:translateX(-0px)}
.win:not(.closed) .pane-r{transform:translateX(52px)}
.k{transition:all .35s;border-radius:5px;padding:0 2px}
.k.hi{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.k.hi2{background:color-mix(in srgb,var(--seal) 18%,transparent);color:var(--seal)}
.an-time{position:relative;height:46px;margin:0 6%}
.an-time .bar{position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line);border-radius:2px}
.an-time .era{position:absolute;top:22px;transform:translateX(-50%);font-size:13px;color:var(--muted)}
.an-time .mk{position:absolute;top:6px;width:15px;height:15px;border-radius:50%;background:var(--c);transform:translateX(-50%);transition:left 1s ease}
.an-word{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:14px;width:100%;max-width:440px}
.an-word .w{font-family:var(--display);font-weight:800;font-size:28px;text-align:right}
.an-word .w.old{font-family:var(--old)}
.an-word small{font-size:14px;color:var(--muted)}
.an-jaeja{display:flex;flex-direction:column;gap:2px;align-items:center}

.gl{width:44px;height:44px}

.gw.drawn .st.add{transition-delay:.55s}
@media (max-width:520px){.an-big{font-size:48px}.an-lane{grid-template-columns:40px 1fr}.an-lane .an-res{grid-column:1/-1;justify-self:end}.an-line,.an-sentence{font-size:18px}.an-chat{grid-template-columns:1fr}.win{grid-column:1;grid-row:auto;justify-self:end}}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:22px 14px;cursor:pointer;background:var(--bg);transition:border-color .2s,background .2s}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.thumbs .th{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}

.thumbs .ta{display:flex;gap:4px}
.thumbs .ta button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12.5px;cursor:pointer;padding:2px 0}

<script>
const UNITS = [];
UNITS.push({
  id: "eumun", name: "음운", sub: "말소리의 체계와 변동", color: "var(--u1)",
  ch: "교재 3장",
  blurb: "뜻을 구별하는 가장 작은 소리 단위와, 소리가 만나면서 바뀌는 규칙을 다룹니다.",
  topics: [
{ id: "eumun-1", title: "음운이란 무엇인가", body: `
<p><b>음운</b>은 말의 뜻을 구별해 주는 소리의 가장 작은 단위예요. 실제로 입에서 나는 구체적인 소리는 <b>음성</b>이고, 사람들이 머릿속에서 "같은 소리"라고 인식하는 추상적인 소리가 음운이에요.</p>
<div class="ex"><b>최소 대립쌍</b>으로 확인하기<br>
<w>불</w> · <w>풀</w> · <w>뿔</w> → 첫소리 ㅂ / ㅍ / ㅃ 하나만 달라도 뜻이 달라짐 → 셋은 각각 다른 음운<br>
<w>달</w> · <w>돌</w> → 모음 ㅏ / ㅗ가 뜻을 가름</div>
<p>'감기'의 첫 ㄱ과 둘째 ㄱ은 실제로는 다르게 소리 나지만(안울림소리와 울림소리), 국어 화자는 이를 구별하지 않고 뜻도 달라지지 않아요. 그래서 둘 다 하나의 음운 /ㄱ/에 속하는 <b>변이음</b>이에요.</p>
<table class="tbl"><tr><th>구분</th><th>내용</th><th>예</th></tr>
<tr><td>분절 음운</td><td>경계를 그어 나눌 수 있는 음운: 자음 19개, 모음 21개(단모음 10 + 이중 모음 11)</td><td>ㄱ, ㅏ …</td></tr>
<tr><td>비분절 음운</td><td>소리의 길이처럼 나눌 수 없지만 뜻을 가르는 요소</td><td><w q="눈">눈</w>[눈ː](雪) / 눈(目), <w q="말">말</w>[말ː](言) / 말(馬)</td></tr></table>
<div class="tip">표기법: 음운은 / /, 실제 발음은 [ ]로 적어요. 'ː'은 긴소리 표시예요.</div>` },

{ id: "eumun-2", title: "자음 체계", body: `
<p>자음은 공기가 입안에서 <b>장애</b>를 받으며 나는 소리예요. <b>어디서</b>(조음 위치) <b>어떻게</b>(조음 방법) 막는지에 따라 19개로 나뉘어요.</p>
<div class="scroll"><table class="tbl center"><tr><th colspan="2">조음 방법 ＼ 조음 위치</th><th>입술소리<br><small>양순음</small></th><th>잇몸소리<br><small>치조음</small></th><th>센입천장소리<br><small>경구개음</small></th><th>여린입천장소리<br><small>연구개음</small></th><th>목청소리<br><small>후음</small></th></tr>
<tr><th rowspan="3">파열음</th><th>예사소리</th><td>ㅂ</td><td>ㄷ</td><td></td><td>ㄱ</td><td></td></tr>
<tr><th>된소리</th><td>ㅃ</td><td>ㄸ</td><td></td><td>ㄲ</td><td></td></tr>
<tr><th>거센소리</th><td>ㅍ</td><td>ㅌ</td><td></td><td>ㅋ</td><td></td></tr>
<tr><th rowspan="3">파찰음</th><th>예사소리</th><td></td><td></td><td>ㅈ</td><td></td><td></td></tr>
<tr><th>된소리</th><td></td><td></td><td>ㅉ</td><td></td><td></td></tr>
<tr><th>거센소리</th><td></td><td></td><td>ㅊ</td><td></td><td></td></tr>
<tr><th rowspan="2">마찰음</th><th>예사소리</th><td></td><td>ㅅ</td><td></td><td></td><td rowspan="2">ㅎ</td></tr>
<tr><th>된소리</th><td></td><td>ㅆ</td><td></td><td></td></tr>
<tr><th colspan="2">비음</th><td>ㅁ</td><td>ㄴ</td><td></td><td>ㅇ</td><td></td></tr>
<tr><th colspan="2">유음</th><td></td><td>ㄹ</td><td></td><td></td><td></td></tr></table></div>
<ul>
<li><b>파열음</b>: 막았다가 터뜨림 / <b>마찰음</b>: 좁은 틈으로 마찰 / <b>파찰음</b>: 막았다가 마찰하며 터짐</li>
<li><b>비음</b>: 코로 공기가 나감 / <b>유음</b>: 혀 옆으로 흘려 보냄</li>
<li>파열음·파찰음·마찰음 = <b>장애음</b>(안울림소리), 비음·유음 = <b>공명음</b>(울림소리)</li>
<li>예사소리 → 된소리(긴장) → 거센소리(거친 숨)로 소리의 세기가 나뉘어요.</li></ul>` },

{ id: "eumun-3", title: "모음 체계", body: `
<p>모음은 공기가 장애 없이 나오는 소리예요. 발음하는 동안 입 모양이 그대로인 <b>단모음</b>(10개)과, 입 모양이 바뀌는 <b>이중 모음</b>(11개)이 있어요.</p>
<div class="scroll"><table class="tbl center"><tr><th rowspan="2">혀의 높이</th><th colspan="2">전설 모음</th><th colspan="2">후설 모음</th></tr>
<tr><th>평순</th><th>원순</th><th>평순</th><th>원순</th></tr>
<tr><th>고모음</th><td>ㅣ</td><td>ㅟ</td><td>ㅡ</td><td>ㅜ</td></tr>
<tr><th>중모음</th><td>ㅔ</td><td>ㅚ</td><td>ㅓ</td><td>ㅗ</td></tr>
<tr><th>저모음</th><td>ㅐ</td><td></td><td>ㅏ</td><td></td></tr></table></div>
<p>세 가지 기준: <b>혀의 최고점 위치</b>(앞=전설 / 뒤=후설), <b>혀의 높이</b>(고·중·저), <b>입술 모양</b>(둥글게=원순 / 평평=평순).</p>
<div class="tip">표준 발음법은 'ㅚ, ㅟ'를 단모음으로 정하되, 이중 모음으로 발음하는 것도 허용해요.</div>
<p><b>이중 모음</b> = 반모음 + 단모음. 반모음은 혼자 음절을 이루지 못하는 짧은 소리예요.</p>
<table class="tbl"><tr><th>반모음</th><th>이중 모음</th></tr>
<tr><td>'ㅣ'계 반모음 [j]</td><td>ㅑ ㅕ ㅛ ㅠ ㅒ ㅖ</td></tr>
<tr><td>'ㅗ/ㅜ'계 반모음 [w]</td><td>ㅘ ㅝ ㅙ ㅞ</td></tr>
<tr><td>'ㅡ'와 'ㅣ'의 결합</td><td>ㅢ</td></tr></table>
<div class="tip">음운 개수를 셀 때 이중 모음은 <b>반모음 1 + 단모음 1 = 2개</b>로 세는 것이 일반적이에요. (예: '여'는 [j]+[ㅓ])</div>` },

{ id: "eumun-4", title: "음절", body: `
<p><b>음절</b>은 한 번에 소리 낼 수 있는 덩어리예요. 국어 음절은 반드시 <b>모음</b>을 하나 가져요.</p>
<table class="tbl"><tr><th>유형</th><th>예</th></tr>
<tr><td>모음</td><td>아, 이, 와</td></tr><tr><td>자음 + 모음</td><td>가, 도, 쥐</td></tr>
<tr><td>모음 + 자음</td><td>악, 옷, 입</td></tr><tr><td>자음 + 모음 + 자음</td><td>각, 몸, 돌</td></tr></table>
<ul><li>초성 자리에 올 수 있는 자음은 1개뿐이고, 초성의 'ㅇ'은 소리가 없어요(음운이 아님).</li>
<li>종성(받침 소리)에는 <b>ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ</b> 7개만 올 수 있어요. 이 제약 때문에 '음절의 끝소리 규칙'과 '자음군 단순화'가 일어나요.</li>
<li>'ㅇ[ŋ]'은 초성에 올 수 없어요.</li></ul>` },

{ id: "eumun-5", title: "음운 변동 한눈에 보기", body: `
<p>형태소와 형태소가 만나거나 특정 환경에 놓이면 소리가 바뀌어요. 이를 <b>음운 변동</b>이라고 하고, 결과에 따라 네 가지로 나눠요.</p>
<div class="grid4">
<div class="kcard"><b>교체(대치)</b><span>한 음운이 다른 음운으로</span><em>음운 개수 그대로</em></div>
<div class="kcard"><b>탈락</b><span>있던 음운이 없어짐</span><em>−1</em></div>
<div class="kcard"><b>첨가</b><span>없던 음운이 생김</span><em>+1</em></div>
<div class="kcard"><b>축약</b><span>두 음운이 하나로 합쳐짐</span><em>−1</em></div></div>
<p>변동의 이유로 나누면 <b>동화</b>(주변 소리를 닮음: 비음화, 유음화, 구개음화)와 <b>이화</b>(주변 소리와 달라짐)가 있어요. 동화는 방향에 따라 <b>순행 동화</b>(앞 소리가 뒤 소리를 바꿈: 칼날→[칼랄])와 <b>역행 동화</b>(뒤 소리가 앞 소리를 바꿈: 신라→[실라])로 나눠요.</p>
<div class="tip">교재에 따라 '보아→[봐]'를 <b>반모음화(교체)</b>로 보기도 하고 <b>모음 축약</b>으로 보기도 해요. 시험에서는 문제의 &lt;보기&gt; 설명을 기준으로 판단하세요.</div>` },

{ id: "eumun-6", title: "교체(대치)", body: `
<h4>① 음절의 끝소리 규칙 (평파열음화)</h4>
<p>받침 자리의 장애음이 대표음 'ㅂ, ㄷ, ㄱ' 중 하나로 바뀌어요.</p>
<table class="tbl"><tr><th>받침</th><th>소리</th><th>예</th></tr>
<tr><td>ㅍ</td><td>[ㅂ]</td><td><w>잎</w>[입], <w>덮개</w>[덥깨]</td></tr>
<tr><td>ㅅ, ㅆ, ㅈ, ㅊ, ㅌ, ㅎ</td><td>[ㄷ]</td><td><w>옷</w>[옫], <w>낮</w>[낟], <w>꽃</w>[꼳], <w>밭</w>[받], <w>히읗</w>[히읃]</td></tr>
<tr><td>ㄲ, ㅋ</td><td>[ㄱ]</td><td><w>밖</w>[박], <w>부엌</w>[부억]</td></tr></table>
<div class="tip">모음으로 시작하는 <b>형식 형태소</b>(조사, 어미, 접미사) 앞에서는 받침이 그대로 넘어가요: 옷이[오시]. <b>실질 형태소</b> 앞에서는 끝소리 규칙 후 넘어가요: 옷 안[오단], <w>겉옷</w>[거돋].</div>
<h4>② 비음화</h4>
<p>파열음 'ㅂ, ㄷ, ㄱ'이 비음 'ㄴ, ㅁ' 앞에서 비음 'ㅁ, ㄴ, ㅇ'으로 바뀌어요. (역행 동화)</p>
<div class="ex"><w>국물</w>[궁물], <w>밥물</w>[밤물], 닫는[단는], <w>앞날</w>[암날], 흙만[흥만]</div>
<p><b>'ㄹ'의 비음화</b>: 'ㅁ, ㅇ' 뒤의 'ㄹ'이 [ㄴ]으로 바뀌어요: <w>침략</w>[침냑], <w>종로</w>[종노]. 'ㄱ, ㅂ' 뒤에서는 ㄹ→ㄴ 뒤에 다시 비음화가 일어나요: <w>협력</w>[혐녁], <w>국립</w>[궁닙].</p>
<h4>③ 유음화</h4>
<p>'ㄴ'이 'ㄹ'의 앞이나 뒤에서 [ㄹ]로 바뀌어요.</p>
<div class="ex">역행: <w>신라</w>[실라], <w>난로</w>[날ː로] &nbsp;|&nbsp; 순행: <w>칼날</w>[칼랄], <w>물난리</w>[물랄리]</div>
<div class="tip">예외: <w>의견란</w>[의ː견난], <w>생산량</w>[생산냥]처럼 'ㄹ'이 [ㄴ]으로 바뀌는 단어도 있어요.</div>
<h4>④ 구개음화</h4>
<p>받침 'ㄷ, ㅌ'이 모음 'ㅣ'로 시작하는 <b>형식 형태소</b>를 만나 [ㅈ, ㅊ]이 돼요.</p>
<div class="ex"><w>굳이</w>[구지], <w>같이</w>[가치], 밭이[바치], <w>닫히다</w>[다치다] (ㄷ+ㅎ→ㅌ 축약 후 구개음화)</div>
<div class="tip">한 형태소 안(<w>잔디</w>, <w>느티나무</w>)이나 실질 형태소 앞에서는 일어나지 않아요.</div>
<h4>⑤ 된소리되기 (경음화)</h4>
<ul>
<li>받침 [ㄱ, ㄷ, ㅂ] 뒤의 예사소리: <w>국밥</w>[국빱], <w>옷고름</w>[옫꼬름], 덮개[덥깨]</li>
<li>용언 어간 받침 'ㄴ(ㄵ), ㅁ(ㄻ)' 뒤 어미: 신고[신ː꼬], 삼고[삼ː꼬], 앉고[안꼬] — 피동·사동 접미사 앞은 예외(안기다[안기다])</li>
<li>관형사형 어미 '-(으)ㄹ' 뒤: 할 것을[할꺼슬], 갈 데가[갈떼가]</li>
<li>한자어 'ㄹ' 받침 뒤 'ㄷ, ㅅ, ㅈ': <w>갈등</w>[갈뜽], <w>발전</w>[발쩐], <w>일시</w>[일씨]</li></ul>
<h4>⑥ 반모음화</h4>
<p>'ㅣ, ㅗ, ㅜ'가 뒤 모음과 만나 반모음으로 바뀌어요: 기-+-어→[겨], 보-+-아→[봐], 주-+-어→[줘].</p>` },

{ id: "eumun-7", title: "탈락", body: `
<h4>① 자음군 단순화</h4>
<p>겹받침 뒤에 자음이 오거나 말이 끝나면 두 자음 중 하나만 발음해요.</p>
<table class="tbl"><tr><th>남는 소리</th><th>겹받침</th><th>예</th></tr>
<tr><td>앞 자음</td><td>ㄳ ㄵ ㄼ ㄽ ㄾ ㅄ</td><td><w>넋</w>[넉], 앉다[안따], <w>여덟</w>[여덜], <w>외곬</w>[외골], 핥다[할따], <w>값</w>[갑]</td></tr>
<tr><td>뒤 자음</td><td>ㄺ ㄻ ㄿ</td><td><w>닭</w>[닥], <w>삶</w>[삼ː], 읊다[읍따]</td></tr></table>
<div class="tip">예외: '밟-'은 자음 앞에서 [밥]: 밟다[밥ː따], 밟는[밤ː는]. '넓-'은 '넓죽하다[넙쭈카다], 넓둥글다[넙뚱글다]'에서 [넙]. 용언의 'ㄺ'은 'ㄱ' 앞에서 [ㄹ]: 맑고[말꼬], 읽거나[일꺼나].</div>
<h4>② 'ㄹ' 탈락</h4>
<div class="ex">용언: 울-+-는→우는, 살-+-니→사니, 알-+-ㅂ니다→압니다, 놀-+-시-+-고→노시고<br>
단어 형성: 딸+님→<w>따님</w>, 솔+나무→<w>소나무</w>, 바늘+질→<w>바느질</w></div>
<h4>③ 'ㅎ' 탈락</h4>
<p>어간 끝 'ㅎ(ㄶ, ㅀ)'이 모음으로 시작하는 어미·접미사 앞에서 사라져요: 좋은[조ː은], 놓아[노아], 많이[마ː니], 싫어[시러].</p>
<h4>④ 'ㅡ' 탈락</h4>
<p>어간의 'ㅡ'가 '-아/-어' 앞에서 사라지고 표기에도 반영돼요: 쓰-+-어→써, 끄-+-어→꺼, 담그-+-아→담가, 바쁘-+-아→바빠.</p>
<h4>⑤ 동음 탈락 ('ㅏ/ㅓ' 탈락)</h4>
<p>같은 모음이 이어지면 하나가 빠져요: 가-+-아서→가서, 서-+-어→서, 건너-+-어도→건너도.</p>
<h4>⑥ 반모음 탈락</h4>
<p>'ㅈ, ㅉ, ㅊ' 뒤의 '져, 쪄, 쳐'는 [저, 쩌, 처]로 발음해요: 지-+-어→져[저], 다치-+-어→다쳐[다처].</p>` },

{ id: "eumun-8", title: "첨가", body: `
<h4>① 'ㄴ' 첨가</h4>
<p>합성어나 파생어에서 앞말이 자음으로 끝나고 뒷말이 '이, 야, 여, 요, 유'로 시작하면 [ㄴ]이 덧나요.</p>
<div class="ex"><w>솜이불</w>[솜ː니불], <w>맨입</w>[맨닙], <w>색연필</w>[생년필], <w>한여름</w>[한녀름], <w>꽃잎</w>[꼰닙]<br>
'ㄹ' 뒤에서는 첨가된 ㄴ이 [ㄹ]로: <w>들일</w>[들ː릴], <w>솔잎</w>[솔립], <w>물엿</w>[물렫]</div>
<div class="tip">늘 일어나지는 않아요. 둘 다 표준인 경우: <w>금융</w>[금늉/그뮹], <w>검열</w>[검ː녈/거ː멸]. 일어나지 않는 경우: <w>송별연</w>[송ː벼련], <w>등용문</w>[등용문], 6·25[유기오].</div>
<h4>② 'ㅅ' 첨가 (사잇소리 현상)</h4>
<p>두 말이 합쳐져 합성 명사가 될 때 원래 없던 소리가 덧나는 현상이에요.</p>
<ul><li>뒷말 첫소리가 된소리로: <w>냇가</w>[내ː까/낻ː까], <w>콧등</w>[코뚱/콛뚱]</li>
<li>뒷말 'ㄴ, ㅁ' 앞에서 [ㄴ]: <w>콧날</w>[콘날], <w>아랫니</w>[아랜니]</li>
<li>뒷말 '이'나 반모음 앞에서 [ㄴㄴ]: <w>깻잎</w>[깬닙], <w>나뭇잎</w>[나문닙]</li></ul>
<div class="tip">사이시옷 표기 조건: 고유어가 하나 이상 들어간 합성어 + 앞말이 모음으로 끝남 + 사잇소리가 남. 두 음절 한자어는 <b>곳간, 셋방, 숫자, 찻간, 툇간, 횟수</b> 6개만 사이시옷을 적어요.</div>
<h4>③ 반모음 첨가</h4>
<p>'ㅣ, ㅚ, ㅟ'로 끝난 어간 뒤 '-어'가 오면 [j]가 덧날 수 있어요: 피어[피어/피여], 되어[되어/되여]. '이오, 아니오'도 [이요, 아니요]로 발음할 수 있어요.</p>` },

{ id: "eumun-9", title: "축약", body: `
<h4>① 자음 축약 (거센소리되기)</h4>
<p>'ㅎ'과 'ㄱ, ㄷ, ㅂ, ㅈ'이 만나 거센소리 'ㅋ, ㅌ, ㅍ, ㅊ' 하나가 돼요. 순서는 상관없어요.</p>
<div class="ex">ㅎ이 앞: 놓고[노코], 좋던[조ː턴], 많지[만ː치]<br>ㅎ이 뒤: <w>국화</w>[구콰], <w>맏형</w>[마텽], 좁히다[조피다], 앉히다[안치다]</div>
<h4>② 모음 축약</h4>
<p>두 모음이 하나의 모음으로 합쳐져요: 보-+-이-+-다→뵈다(ㅗ+ㅣ→ㅚ), 사이→새(ㅏ+ㅣ→ㅐ), 아이→애.</p>` },

{ id: "eumun-10", title: "음운 변동 체험기", body: `
<p>단어를 고르면 변동이 일어나는 순서와 종류, 음운 개수의 변화를 단계별로 보여 줘요.</p>
<div data-widget="phon"></div>
<div class="tip">음운 개수는 초성 'ㅇ'은 빼고, 겹받침은 2개, 이중 모음은 2개(반모음+단모음)로 세었어요. 긴소리 'ː'는 세지 않아요.</div>` },

{ id: "eumun-11", title: "그 밖의 현상: 모음조화·두음 법칙", body: `
<h4>모음조화</h4>
<p>양성 모음(ㅏ, ㅗ)은 양성 모음끼리, 음성 모음(ㅓ, ㅜ, ㅡ …)은 음성 모음끼리 어울리려는 현상이에요.</p>
<div class="ex">의성어·의태어: <w>졸졸</w>/<w>줄줄</w>, <w>알록달록</w>/<w>얼룩덜룩</w>, <w>반짝반짝</w>/<w>번쩍번쩍</w><br>어미: 막아/먹어, 보아/주어</div>
<p>현대 국어에서는 많이 약해졌어요(예: <w>깡충깡충</w>은 표준어로 인정).</p>
<h4>두음 법칙</h4>
<p>단어 첫머리에 'ㄹ, 녀·뇨·뉴·니'가 오는 것을 피하는 현상이에요.</p>
<div class="ex">녀자→<w>여자</w>, 력사→<w>역사</w>, 로인→<w>노인</w>, 래일→<w>내일</w></div>` }
  ]
});

UNITS.push({
  id: "danei", name: "단어 · 어휘 · 의미", sub: "형태소에서 의미 관계까지", color: "var(--u2)",
  ch: "교재 4·5·7장",
  blurb: "형태소와 단어의 형성, 9품사, 어휘의 체계와 양상, 단어와 문장의 의미를 다룹니다.",
  topics: [
{ id: "danei-1", title: "형태소", body: `
<p><b>형태소</b>는 뜻을 가진 가장 작은 말의 단위예요. 더 쪼개면 뜻이 없어져요.</p>
<table class="tbl"><tr><th>기준</th><th>종류</th><th>설명</th></tr>
<tr><td rowspan="2">자립성</td><td>자립 형태소</td><td>혼자 쓰일 수 있음: 명사, 대명사, 수사, 관형사, 부사, 감탄사</td></tr>
<tr><td>의존 형태소</td><td>다른 말에 기대어 쓰임: 조사, 어간, 어미, 접사</td></tr>
<tr><td rowspan="2">의미</td><td>실질 형태소</td><td>구체적 대상·동작·상태를 나타냄: 자립 형태소 + 용언의 어간</td></tr>
<tr><td>형식 형태소</td><td>문법적 관계를 나타냄: 조사, 어미, 접사</td></tr></table>
<div data-widget="morph"></div>
<p><b>이형태</b>: 같은 형태소가 환경에 따라 모양을 달리하는 것.</p>
<ul><li>음운론적 이형태: 주격 '이/가', 목적격 '을/를', 선어말 '-았-/-었-' (앞 소리에 따라 결정)</li>
<li>형태론적 이형태: '하-' 뒤의 '-여'(하여), '-였-'(하였다) (특정 단어 때문에 결정)</li></ul>` },

{ id: "danei-2", title: "단어와 단어의 형성", body: `
<p><b>단어</b>는 자립할 수 있는 말이나, 자립할 수 있는 말에 쉽게 분리되는 말(조사)이에요. 학교 문법은 <b>조사는 단어로 인정</b>하지만 <b>어미는 단어로 보지 않아요</b>.</p>
<p>단어를 이루는 요소는 중심 의미를 가진 <b>어근</b>과, 어근에 붙어 뜻을 더하는 <b>접사</b>예요.</p>
<table class="tbl"><tr><th colspan="2">구조</th><th>예</th></tr>
<tr><td colspan="2">단일어 (어근 하나)</td><td><w>하늘</w>, <w>나무</w>, <w>먹다</w></td></tr>
<tr><td rowspan="2">복합어</td><td>파생어 (어근 + 접사)</td><td><w>풋사과</w>, <w>먹이</w>, <w>높이다</w></td></tr>
<tr><td>합성어 (어근 + 어근)</td><td><w>밤낮</w>, <w>돌다리</w>, <w>오가다</w></td></tr></table>
<h4>파생어</h4>
<ul><li><b>접두사</b>: 어근 앞에 붙어 뜻을 더함. 대체로 품사를 바꾸지 않아요. <w>풋사과</w>, <w>맨발</w>, <w>헛디디다</w>, <w>짓밟다</w>, <w>드높다</w></li>
<li><b>접미사</b>: 어근 뒤에 붙음.
<br>· 뜻만 더하는 것(한정적): <w>잠꾸러기</w>, <w>선생님</w>, <w>밀치다</w>
<br>· 품사까지 바꾸는 것(지배적): 먹-+-이→<w>먹이</w>(명사), 높-+-이-→<w>높이다</w>(동사), 슬기+-롭-→<w>슬기롭다</w>(형용사), 많-+-이→<w>많이</w>(부사)</li></ul>
<h4>합성어</h4>
<table class="tbl"><tr><th>배열 방식</th><th>설명</th><th>예</th></tr>
<tr><td>통사적 합성어</td><td>국어 문장의 단어 배열과 같음</td><td><w>작은형</w>(관형사형+명사), <w>돌아가다</w>(연결 어미 사용), <w>힘들다</w>(주어+서술어 관계), <w>새해</w>(관형사+명사)</td></tr>
<tr><td>비통사적 합성어</td><td>국어 문장에서는 나타나지 않는 배열</td><td><w>늦잠</w>·<w>덮밥</w>(어간이 바로 명사 앞), <w>오가다</w>·<w>검붉다</w>(연결 어미 없이 어간+어간), <w>부슬비</w>(부사+명사)</td></tr></table>
<p>의미 관계로는 <b>대등</b>(<w>손발</w>, <w>오가다</w>), <b>종속</b>(<w>돌다리</w>, <w>책가방</w>), <b>융합</b>(<w>밤낮</w> '늘', <w>춘추</w> '나이', <w>피땀</w> '노력') 합성어로 나눠요.</p>
<div class="tip">합성어와 구 구별: <w>큰집</w>(큰아버지 댁, 합성어) / 큰 집(크기가 큰 집, 구). 합성어는 사이에 다른 말을 넣을 수 없고 의미가 특수해지는 경우가 많아요.</div>` },

{ id: "danei-3", title: "품사 한눈에 보기", body: `
<p>단어를 <b>형태</b>(모양이 바뀌는가), <b>기능</b>(문장에서 하는 일), <b>의미</b>(무엇을 나타내는가)에 따라 9품사로 나눠요.</p>
<div class="scroll"><table class="tbl center"><tr><th>형태</th><th>기능</th><th>의미</th></tr>
<tr><td rowspan="8">불변어</td><td rowspan="3">체언</td><td>명사</td></tr><tr><td>대명사</td></tr><tr><td>수사</td></tr>
<tr><td>관계언</td><td>조사 <small>(서술격 조사 '이다'는 활용함)</small></td></tr>
<tr><td rowspan="2">수식언</td><td>관형사</td></tr><tr><td>부사</td></tr>
<tr><td>독립언</td><td>감탄사</td></tr>
<tr><td colspan="2" style="text-align:left"><small>위 7개는 형태가 변하지 않음</small></td></tr>
<tr><td rowspan="2">가변어</td><td rowspan="2">용언</td><td>동사</td></tr><tr><td>형용사</td></tr></table></div>` },

{ id: "danei-4", title: "체언: 명사 · 대명사 · 수사", body: `
<h4>명사</h4>
<ul><li>쓰이는 범위: 보통 명사(<w>사람</w>, <w>도시</w>) / 고유 명사(<w>세종</w>, <w>한강</w>)</li>
<li>자립성: 자립 명사 / <b>의존 명사</b> — 앞에 꾸미는 말이 꼭 있어야 함</li></ul>
<table class="tbl"><tr><th>의존 명사</th><th>예</th></tr>
<tr><td>보편성</td><td>먹을 <b>것</b>, 아는 <b>바</b>, 갈 <b>데</b></td></tr>
<tr><td>주어성</td><td>떠난 <b>지</b> 오래다, 할 <b>수</b> 있다</td></tr>
<tr><td>서술성</td><td>최선을 다할 <b>따름</b>이다, 웃을 <b>뿐</b>이다</td></tr>
<tr><td>부사성</td><td>시키는 <b>대로</b>, 먹을 <b>만큼</b></td></tr>
<tr><td>단위성</td><td>사과 한 <b>개</b>, 소 두 <b>마리</b>, 신발 한 <b>켤레</b></td></tr></table>
<h4>대명사</h4>
<ul><li>인칭 대명사: 1인칭(나, 저, 우리), 2인칭(너, 당신), 3인칭(그, 그녀), 미지칭(누구), 부정칭(아무), 재귀칭(자기, 저, 당신)</li>
<li>지시 대명사: 사물(이것, 그것, 저것, 무엇), 처소(여기, 거기, 저기, 어디)</li></ul>
<div class="tip">'당신'은 2인칭(당신은 누구세요?)과 재귀칭(할아버지께서는 당신의 책을 아끼셨다)으로 모두 쓰여요.</div>
<h4>수사</h4>
<p>양수사(하나, 둘, 일, 이) / 서수사(첫째, 둘째, 제일).</p>
<div class="tip">수사와 수 관형사 구별: 사과 <b>다섯</b>을 샀다(조사가 붙음 → 수사) / <b>다섯</b> 개(명사를 꾸밈 → 관형사).</div>` },

{ id: "danei-5", title: "관계언: 조사", body: `
<table class="tbl"><tr><th colspan="2">종류</th><th>예</th></tr>
<tr><td rowspan="7">격 조사<br><small>앞말의 문장 성분 자격을 정함</small></td><td>주격</td><td>이/가, 께서, 에서(단체): 학교<b>에서</b> 상을 주었다</td></tr>
<tr><td>서술격</td><td>이다 (활용함: 학생이다, 학생이고, 학생이니)</td></tr>
<tr><td>목적격</td><td>을/를</td></tr>
<tr><td>보격</td><td>이/가 ('되다, 아니다' 앞): 물이 얼음<b>이</b> 되었다</td></tr>
<tr><td>관형격</td><td>의</td></tr>
<tr><td>부사격</td><td>에, 에서, 에게, 께, (으)로, 와/과(비교·동반), 보다, 처럼 …</td></tr>
<tr><td>호격</td><td>아/야, (이)여, (이)시여</td></tr>
<tr><td colspan="2">접속 조사</td><td>와/과, 하고, (이)며, (이)랑: 철수<b>와</b> 영희는 친구다</td></tr>
<tr><td colspan="2">보조사 <small>특별한 뜻을 더함</small></td><td>은/는(대조·화제), 도(역시), 만(단독), 까지·조차·마저, 부터, 요(높임)</td></tr></table>
<div class="tip">'와/과' 구별: 나는 철수<b>와</b> 영희를 만났다(둘을 이음 → 접속 조사) / 나는 철수<b>와</b> 싸웠다(서술어의 상대 → 부사격 조사).</div>` },

{ id: "danei-6", title: "용언: 동사 · 형용사와 활용", body: `
<h4>동사와 형용사 구별</h4>
<table class="tbl"><tr><th>확인 방법</th><th>동사</th><th>형용사</th></tr>
<tr><td>현재 '-는다/-ㄴ다'</td><td>먹<b>는다</b> (O)</td><td>예쁜다 (X)</td></tr>
<tr><td>관형사형 '-는'</td><td>먹<b>는</b> 사람 (O)</td><td>예쁘는 (X)</td></tr>
<tr><td>명령형·청유형</td><td>먹어라, 먹자 (O)</td><td>예뻐라(명령), 예쁘자 (X)</td></tr></table>
<div class="tip">'있다'는 둘 다예요: 집에 있어라(동사) / 돈이 있다(형용사). '크다'도 키가 쑥쑥 큰다(동사) / 키가 크다(형용사).</div>
<h4>본용언과 보조 용언</h4>
<p>보조 용언은 본용언 뒤에서 의미를 더해요: 먹어 <b>보다</b>(시도), 먹고 <b>싶다</b>(희망), 다 먹어 <b>버렸다</b>(완료).</p>
<h4>활용: 어간 + 어미</h4>
<table class="tbl"><tr><th colspan="2">어미</th><th>예</th></tr>
<tr><td rowspan="3">어말 어미</td><td>종결 어미</td><td>-다, -냐, -어라, -자, -구나</td></tr>
<tr><td>연결 어미</td><td>대등적(-고, -며, -지만), 종속적(-어서, -면, -니), 보조적(-아/어, -게, -지, -고)</td></tr>
<tr><td>전성 어미</td><td>명사형(-(으)ㅁ, -기), 관형사형(-(으)ㄴ, -는, -(으)ㄹ, -던), 부사형(-게, -도록)</td></tr>
<tr><td colspan="2">선어말 어미</td><td>-시-(높임), -었-(과거), -겠-(추측·의지), -더-(회상)</td></tr></table>
<h4>규칙 활용과 불규칙 활용</h4>
<div class="scroll"><table class="tbl"><tr><th>바뀌는 곳</th><th>종류</th><th>예</th><th>비교: 규칙</th></tr>
<tr><td rowspan="5">어간</td><td>'ㅅ' 불규칙</td><td><w>짓다</w>→지어</td><td>벗다→벗어</td></tr>
<tr><td>'ㄷ' 불규칙</td><td><w>듣다</w>→들어</td><td>묻다(埋)→묻어</td></tr>
<tr><td>'ㅂ' 불규칙</td><td><w>돕다</w>→도와, 덥다→더워</td><td>잡다→잡아</td></tr>
<tr><td>'르' 불규칙</td><td><w>흐르다</w>→흘러</td><td>치르다→치러 (ㅡ 탈락)</td></tr>
<tr><td>'우' 불규칙</td><td><w>푸다</w>→퍼 (유일)</td><td>주다→줘</td></tr>
<tr><td rowspan="2">어미</td><td>'여' 불규칙</td><td>하다→하여</td><td>파다→파</td></tr>
<tr><td>'러' 불규칙</td><td>이르다(至)→이르러, <w>푸르다</w>→푸르러</td><td>치르다→치러</td></tr>
<tr><td>어간+어미</td><td>'ㅎ' 불규칙</td><td><w>파랗다</w>→파래, 하얗다→하얘</td><td>좋다→좋아</td></tr></table></div>
<div class="tip">'ㄹ' 탈락(울다→우는)과 'ㅡ' 탈락(쓰다→써)은 예외 없이 일어나므로 <b>규칙 활용</b>으로 봐요.</div>` },

{ id: "danei-7", title: "수식언 · 독립언 · 품사 통용", body: `
<h4>관형사: 체언을 꾸밈, 조사가 붙지 않음</h4>
<p>성상 관형사(<w>새</w> 옷, <w>헌</w> 책, <w>옛</w> 친구), 지시 관형사(<b>이</b> 책, <b>그</b> 사람), 수 관형사(<b>한</b> 사람, <b>첫</b> 만남)</p>
<h4>부사: 주로 용언을 꾸밈, 보조사가 붙을 수 있음</h4>
<ul><li>성분 부사: 성상(잘, 매우), 지시(이리, 그리), 부정(안, 못)</li>
<li>문장 부사: 양태(과연, 설마, 아마, 제발), 접속(그리고, 그러나, 및)</li></ul>
<h4>감탄사</h4><p>놀람, 부름, 대답 등: 아, 어머, 여보세요, 네, 아니요</p>
<h4>품사 통용: 한 단어가 둘 이상의 품사로 쓰임</h4>
<table class="tbl"><tr><th>단어</th><th>쓰임</th></tr>
<tr><td><w>비교적</w></td><td>비교적인 방법(명사) / 비교적 관점(관형사) / 비교적 쉽다(부사)</td></tr>
<tr><td><w>만큼</w></td><td>너<b>만큼</b>(조사) / 먹을 <b>만큼</b>(의존 명사)</td></tr>
<tr><td><w>대로</w></td><td>법<b>대로</b>(조사) / 아는 <b>대로</b>(의존 명사)</td></tr>
<tr><td><w>아니</w></td><td>아니 먹다(부사) / 아니, 벌써 왔어?(감탄사)</td></tr>
<tr><td><w>오늘</w></td><td>오늘이 생일이다(명사) / 오늘 떠난다(부사)</td></tr></table>` },

{ id: "danei-8", title: "어휘의 체계와 양상", body: `
<p><b>어휘</b>는 일정한 범위 안에서 쓰이는 단어들의 집합이에요.</p>
<h4>어종에 따른 분류</h4>
<table class="tbl"><tr><th>종류</th><th>특징</th><th>예</th></tr>
<tr><td>고유어</td><td>본래부터 있던 말, 감각어·친족어가 풍부</td><td><w>하늘</w>, <w>노르스름하다</w></td></tr>
<tr><td>한자어</td><td>한자에 기반, 개념을 세분해 표현</td><td>생각 → <w>사고</w>, <w>사색</w>, <w>상상</w></td></tr>
<tr><td>외래어</td><td>다른 언어에서 들어와 국어처럼 쓰임</td><td><w>버스</w>, <w>컴퓨터</w></td></tr>
<tr><td>혼종어</td><td>어종이 섞여 만들어짐</td><td><w>밥상</w>(고유어+한자어), 가스관</td></tr></table>
<h4>어휘의 양상</h4>
<table class="tbl"><tr><th>종류</th><th>설명과 예</th></tr>
<tr><td>지역 방언</td><td>지역에 따라 다른 말 (부추 → 정구지, 솔)</td></tr>
<tr><td>사회 방언</td><td>세대·성별·직업·계층 등에 따라 다른 말</td></tr>
<tr><td>은어</td><td>특정 집단이 내부 결속이나 비밀 유지를 위해 쓰는 말</td></tr>
<tr><td>속어</td><td>비속하고 천한 느낌의 말, 친근감을 주기도 함</td></tr>
<tr><td>금기어 · 완곡어</td><td>꺼리는 말(금기어)을 대신하는 부드러운 말(완곡어): 죽다 → <w>돌아가시다</w>, 천연두 → <w>마마</w></td></tr>
<tr><td>관용어 · 속담</td><td>둘 이상의 단어가 굳어져 새 의미: <w>발이 넓다</w>, <w>미역국을 먹다</w></td></tr>
<tr><td>새말(신어)</td><td>새로 생긴 개념·사물을 위해 만들어지거나 들어온 말</td></tr>
<tr><td>전문어</td><td>특정 분야에서 쓰는 말 (의학, 법률 용어 등)</td></tr></table>` },

{ id: "danei-9", title: "단어의 의미와 의미 관계", body: `
<h4>의미의 종류</h4>
<ul><li><b>중심적 의미</b>(가장 기본): 밥을 <b>먹다</b> / <b>주변적 의미</b>(확장): 나이를 <b>먹다</b>, 겁을 <b>먹다</b></li>
<li><b>사전적(개념적) 의미</b>: 어머니 = '자기를 낳아 준 여자' / <b>함축적 의미</b>: 사랑, 희생 등 연상되는 의미</li></ul>
<h4>유의 관계</h4>
<p>소리는 다르지만 의미가 비슷한 관계. 완전히 같은 경우는 드물고 쓰임이 조금씩 달라요: <w>가끔</w>/<w>이따금</w>, <w>책방</w>/<w>서점</w>.</p>
<h4>반의 관계</h4>
<p>다른 의미 요소는 모두 같고 <b>하나만</b> 달라요.</p>
<table class="tbl"><tr><th>종류</th><th>특징</th><th>예</th></tr>
<tr><td>상보 반의어</td><td>중간이 없음, 한쪽을 부정하면 다른 쪽이 됨</td><td>살다/죽다, 남자/여자</td></tr>
<tr><td>정도(등급) 반의어</td><td>중간이 있음, 둘 다 부정 가능, 비교 표현 가능</td><td>크다/작다, 덥다/춥다</td></tr>
<tr><td>방향(관계) 반의어</td><td>방향·관계상 대립</td><td>위/아래, 오다/가다, 부모/자식</td></tr></table>
<div class="tip">다의어는 반의어가 여러 개일 수 있어요: <w>벗다</w> ↔ (옷을) 입다, (모자를) 쓰다, (신발을) 신다.</div>
<h4>상하 관계</h4>
<p>한 단어가 다른 단어를 포함하는 관계. 하의어는 상의어의 의미를 모두 가지면서 의미 요소가 더 많아요: <w>꽃</w> ⊃ <w>장미</w>, 동물 ⊃ 포유류 ⊃ 개.</p>
<h4>다의어와 동음이의어</h4>
<p><b>다의어</b>는 중심 의미에서 뜻이 넓어진 한 단어이고, <b>동음이의어</b>는 소리만 같은 별개의 단어예요. 사전에서 다의어는 한 표제어 아래 ①②로, 동음이의어는 <b>다리¹, 다리²</b>처럼 서로 다른 표제어로 실려요.</p>
<div class="ex"><w q="다리">다리</w>: 사람의 다리 → 책상 다리 (다의어) / 강을 건너는 다리 (동음이의어) — 사전에서 직접 확인해 보세요.</div>` },

{ id: "danei-10", title: "문장의 의미: 중의성 · 전제 · 함의", body: `
<h4>중의성: 하나의 표현이 두 가지 이상으로 해석됨</h4>
<table class="tbl"><tr><th>종류</th><th>예</th><th>해석</th></tr>
<tr><td>어휘적</td><td><w>배</w>가 좋다</td><td>먹는 배? 타는 배? 신체의 배?</td></tr>
<tr><td>구조적</td><td>아름다운 그녀의 목소리</td><td>그녀가 아름다운가, 목소리가 아름다운가</td></tr>
<tr><td>비교 구문</td><td>남편은 나보다 축구를 더 좋아한다</td><td>나를 좋아하는 것보다? 내가 축구를 좋아하는 것보다?</td></tr>
<tr><td>부정 범위</td><td>학생들이 다 오지 않았다</td><td>전부 안 옴 / 일부만 옴</td></tr></table>
<p>해소 방법: 쉼표 넣기, 어순 바꾸기, 보조사(는, 도) 쓰기, 단어 보충하기.</p>
<h4>전제와 함의</h4>
<table class="tbl"><tr><th></th><th>전제</th><th>함의</th></tr>
<tr><td>뜻</td><td>문장이 성립하려면 미리 참이어야 하는 내용</td><td>문장이 참이면 반드시 참이 되는 내용</td></tr>
<tr><td>부정했을 때</td><td>그대로 유지됨</td><td>유지되지 않음</td></tr>
<tr><td>예</td><td>"철수가 담배를 끊었다" → 철수는 담배를 피웠다</td><td>"철수가 유리창을 깼다" → 유리창이 깨졌다</td></tr></table>` }
  ]

  topics: [
{ id: "munjang-1", title: "문법 단위와 문장 성분", body: `
<p>문법 단위: <b>형태소 &lt; 단어 &lt; 어절 &lt; 구 &lt; 절 &lt; 문장</b>. <b>어절</b>은 띄어 쓰는 단위이고 문장 성분을 따지는 기본 단위예요. <b>구</b>는 주어-서술어 관계가 없는 묶음, <b>절</b>은 주어-서술어 관계가 있지만 독립된 문장으로 쓰이지 않는 묶음이에요.</p>
<table class="tbl"><tr><th colspan="2">성분</th><th>설명</th><th>예</th></tr>
<tr><td rowspan="4">주성분</td><td>주어</td><td>동작·상태의 주체 (이/가, 께서, 에서)</td><td><b>할머니께서</b> 오셨다</td></tr>
<tr><td>서술어</td><td>주어를 설명 (어찌하다, 어떠하다, 무엇이다)</td><td>꽃이 <b>피었다</b></td></tr>
<tr><td>목적어</td><td>동작의 대상 (을/를)</td><td>나는 <b>책을</b> 읽었다</td></tr>
<tr><td>보어</td><td>'되다, 아니다' 앞에서 보충 (이/가)</td><td>그는 <b>학생이</b> 아니다</td></tr>
<tr><td rowspan="2">부속 성분</td><td>관형어</td><td>체언을 꾸밈</td><td><b>새</b> 옷, <b>나의</b> 꿈, <b>예쁜</b> 꽃</td></tr>
<tr><td>부사어</td><td>용언·문장 등을 꾸밈</td><td><b>빨리</b> 와라, <b>학교에</b> 간다</td></tr>
<tr><td>독립 성분</td><td>독립어</td><td>다른 성분과 직접 관계없음</td><td><b>아</b>, 날씨 좋다. <b>철수야</b>, 가자.</td></tr></table>
<div data-widget="sent"></div>` },

{ id: "munjang-2", title: "서술어의 자릿수", body: `
<p>서술어가 문장을 완성하기 위해 꼭 필요로 하는 성분의 수예요. 이때 <b>필수적 부사어</b>도 셉니다.</p>
<table class="tbl"><tr><th>자릿수</th><th>필요한 성분</th><th>예</th></tr>
<tr><td>한 자리</td><td>주어</td><td>꽃이 <b>피었다</b>. 하늘이 <b>푸르다</b>.</td></tr>
<tr><td rowspan="3">두 자리</td><td>주어 + 목적어</td><td>철수가 밥을 <b>먹었다</b>.</td></tr>
<tr><td>주어 + 보어</td><td>물이 얼음이 <b>되었다</b>.</td></tr>
<tr><td>주어 + 필수적 부사어</td><td>영희는 엄마와 <b>닮았다</b>. 이 옷은 나에게 <b>맞다</b>.</td></tr>
<tr><td>세 자리</td><td>주어 + 목적어 + 필수적 부사어</td><td>나는 동생에게 선물을 <b>주었다</b>. 그는 책을 책상 위에 <b>놓았다</b>.</td></tr></table>
<div class="tip">같은 단어라도 뜻에 따라 자릿수가 달라요: 해가 <w>뜨다</w>(한 자리) / 눈을 뜨다(두 자리).</div>` },

{ id: "munjang-3", title: "홑문장과 겹문장: 안은문장", body: `
<p>주어-서술어 관계가 한 번이면 <b>홑문장</b>, 두 번 이상이면 <b>겹문장</b>이에요. 겹문장은 <b>안은문장</b>과 <b>이어진문장</b>으로 나뉘어요.</p>
<table class="tbl"><tr><th>안긴문장(절)</th><th>만드는 방법</th><th>예</th></tr>
<tr><td>명사절</td><td>-(으)ㅁ, -기</td><td>[그가 범인<b>임</b>]이 밝혀졌다. 나는 [봄이 오<b>기</b>]를 기다린다.</td></tr>
<tr><td>관형절</td><td>-(으)ㄴ, -는, -(으)ㄹ, -던</td><td>[내가 읽<b>은</b>] 책, [그가 합격했다<b>는</b>] 소식</td></tr>
<tr><td>부사절</td><td>-이, -게, -도록 …</td><td>눈이 [소리도 없<b>이</b>] 내린다. 꽃이 [아름답<b>게</b>] 피었다.</td></tr>
<tr><td>서술절</td><td>표지 없음</td><td>코끼리는 [코가 길다]. 토끼는 [앞발이 짧다].</td></tr>
<tr><td>인용절</td><td>직접 '라고', 간접 '고'</td><td>그는 ["내일 갈게."<b>라고</b>] 말했다. 그는 [다음 날 오겠다<b>고</b>] 말했다.</td></tr></table>
<h4>관형절의 두 종류</h4>
<ul><li><b>관계 관형절</b>: 꾸밈을 받는 말이 관형절의 성분으로 빠져 있음 — [내가 ( ) 읽은] <u>책</u> (목적어 '책을'이 빠짐)</li>
<li><b>동격 관형절</b>: 관형절이 꾸밈을 받는 말의 내용 자체, 빠진 성분 없음 — [그가 합격했다는] <u>소식</u></li></ul>
<div class="tip">직접 인용 → 간접 인용으로 바꿀 때 인칭(나→자기), 시간 표현(내일→다음 날), 종결 어미(-ㄹ게→-겠다고)가 함께 바뀌어요.</div>` },

{ id: "munjang-4", title: "이어진문장", body: `
<table class="tbl"><tr><th>종류</th><th>연결 어미와 의미</th><th>예</th></tr>
<tr><td>대등하게 이어진문장</td><td>-고(나열), -며, -지만·-나(대조), -거나·-든지(선택)</td><td>봄이 오고 꽃이 핀다. 형은 크지만 동생은 작다.</td></tr>
<tr><td>종속적으로 이어진문장</td><td>-어서·-니(원인), -면(조건), -(으)려고(의도), -더라도(양보), -는데(배경)</td><td>비가 와서 길이 미끄럽다. 열심히 하면 잘될 것이다.</td></tr></table>
<div class="tip">대등하게 이어진문장은 앞뒤를 바꿔도 의미가 거의 같지만, 종속적으로 이어진문장은 바꾸면 의미가 달라지거나 어색해져요. 또 종속절은 뒤 절 안으로 옮길 수 있어서(길이 비가 와서 미끄럽다) 부사절을 안은문장과 비슷한 성격을 가져요.</div>` },

{ id: "munjang-5", title: "종결 표현", body: `
<table class="tbl"><tr><th>문장 종류</th><th>특징</th><th>예</th></tr>
<tr><td>평서문</td><td>특별한 요구 없이 전달</td><td>비가 온다.</td></tr>
<tr><td>의문문</td><td><b>설명</b> 의문문(의문사, 구체적 대답) / <b>판정</b> 의문문(예·아니요) / <b>수사</b> 의문문(대답 요구 없이 강조·명령)</td><td>어디 가니? / 밥 먹었니? / 내가 그걸 모를까?</td></tr>
<tr><td>명령문</td><td>행동 요구. 직접 명령(-아라/-어라), 간접 명령(-(으)라: 매체·시험지)</td><td>빨리 와라. 알맞은 것을 고르라.</td></tr>
<tr><td>청유문</td><td>함께 하자고 요청</td><td>같이 가자.</td></tr>
<tr><td>감탄문</td><td>느낌을 표현</td><td>정말 아름답구나!</td></tr></table>` },

{ id: "munjang-6", title: "높임 표현", body: `
<h4>주체 높임: 문장의 주어를 높임</h4>
<ul><li>선어말 어미 '-(으)시-', 조사 '께서'</li>
<li>특수 어휘: <w>계시다</w>, <w>주무시다</w>, <w>잡수시다</w>, <w>편찮으시다</w></li>
<li><b>간접 높임</b>: 높일 대상의 신체·소유물·관련 사물을 높여 주체를 간접적으로 높임 — 할머니께서는 귀가 밝<b>으시</b>다. 선생님께서는 걱정이 <b>있으시</b>다.</li></ul>
<div class="tip">'계시다'는 주체를 직접 높일 때, '있으시다'는 간접 높일 때 써요. "말씀하신 상품은 품절이세요"처럼 사물을 높이는 것은 잘못이에요.</div>
<h4>객체 높임: 목적어·부사어가 가리키는 대상을 높임</h4>
<p>조사 '께', 특수 어휘 <w>드리다</w>, <w>모시다</w>, <w>여쭈다</w>(여쭙다), <w>뵈다</w>(뵙다): 나는 할머니<b>께</b> 선물을 <b>드렸다</b>.</p>
<h4>상대 높임: 듣는 사람을 높이거나 낮춤 (종결 어미)</h4>
<table class="tbl"><tr><th colspan="2">등급</th><th>예</th></tr>
<tr><td rowspan="4">격식체</td><td>하십시오체</td><td>갑니다, 가십시오</td></tr>
<tr><td>하오체</td><td>가오, 가시오</td></tr><tr><td>하게체</td><td>가네, 가게</td></tr><tr><td>해라체</td><td>간다, 가라</td></tr>
<tr><td rowspan="2">비격식체</td><td>해요체</td><td>가요</td></tr><tr><td>해체</td><td>가, 가지</td></tr></table>
<div class="tip">압존법: 높여야 할 대상이지만 듣는 이가 더 높을 때 높임을 줄이는 것. 표준 언어 예절에서는 직장에서는 압존법을 쓰지 않는 것을 원칙으로 해요.</div>` },

{ id: "munjang-7", title: "시간 표현", body: `
<p><b>발화시</b>(말하는 때)와 <b>사건시</b>(일이 일어난 때)의 앞뒤 관계로 시제를 정해요.</p>
<table class="tbl"><tr><th>시제</th><th>관계</th><th>실현 방법</th></tr>
<tr><td>과거</td><td>사건시 &lt; 발화시</td><td>-았/었-, -았었-(단절), -더-(회상), 관형사형 동사 -(으)ㄴ·-던, 부사 '어제'</td></tr>
<tr><td>현재</td><td>사건시 = 발화시</td><td>동사 -는/ㄴ-(먹는다), 형용사·'이다'는 기본형(예쁘다), 관형사형 동사 -는·형용사 -(으)ㄴ, 부사 '지금'</td></tr>
<tr><td>미래</td><td>사건시 &gt; 발화시</td><td>-겠-, -(으)리-, -(으)ㄹ 것이다, 관형사형 -(으)ㄹ, 부사 '내일'</td></tr></table>
<p><b>절대 시제</b>는 발화시 기준, <b>상대 시제</b>는 안은문장의 사건시 기준이에요: 어제 [공부하<b>는</b>] 동생을 보았다 → 절대 시제는 과거, '공부하는'의 상대 시제는 현재.</p>
<h4>동작상</h4>
<ul><li>진행상: -고 있다, -는 중이다 (책을 읽고 있다)</li>
<li>완료상: -어 있다, -어 버리다 (꽃이 피어 있다)</li></ul>
<div class="tip">"옷을 입고 있다"는 입는 중(진행)인지, 입은 상태(완료)인지 중의적이에요.</div>` },

{ id: "munjang-8", title: "피동 표현과 사동 표현", body: `
<h4>피동: 주어가 남의 행동을 당함</h4>
<table class="tbl"><tr><th>방법</th><th>예</th></tr>
<tr><td>파생적 피동 (-이-, -히-, -리-, -기-)</td><td>보이다, 잡히다, 물리다, 안기다</td></tr>
<tr><td>통사적 피동 (-아/어지다, -게 되다)</td><td>만들어지다, 알게 되다</td></tr></table>
<div class="ex">능동: 경찰이 도둑을 <b>잡았다</b>. → 피동: 도둑이 경찰에게 <b>잡혔다</b>.<br>(능동문의 목적어 → 피동문의 주어, 능동문의 주어 → 부사어)</div>
<div class="tip">이중 피동은 피해요: <w>잊혀지다</w> → 잊히다, 보여지다 → 보이다.</div>
<h4>사동: 주어가 남에게 행동을 하게 함</h4>
<table class="tbl"><tr><th>방법</th><th>예</th></tr>

  const lane = (k, a, ak, b, bk, word, kind) => `<div class="an-lane f" data-k="${k}"><span class="an-row join"><span class="mt ${ak}">${a}</span><span class="an-plus">+</span><span class="mt ${bk}">${b}</span></span><span class="an-res"><b>${word}</b> <small>${kind}</small></span></div>`;
  r.innerHTML = lane("a","풋-","jeop","사과","geun","풋사과","파생어") + lane("b","먹-","geun","-이","jeop","먹이","파생어") + lane("c","돌","geun","다리","geun","돌다리","합성어") +
    `<div class="an-legend"><span class="lg geun">어근</span><span class="lg jeop">접사</span></div>`;
  const go = k => () => { const l = q(r, `[data-k="${k}"]`); q(l, ".join").classList.add("on"); q(l, ".an-res").classList.add("done"); };
  return [[go("a"), 1300], [go("b"), 1300], [go("c"), 2400]];
}},

function mountScene(el){
  const sc = SCENES[el.dataset.scene]; if (!sc) return;
  el.className = "anim";
  el.innerHTML = `<div class="an-body"></div><div class="anim-cap"><span>${sc.cap}</span><button class="btn small" type="button">다시 보기</button></div>`;
  const body = q(el, ".an-body"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let frames, i, timer = null, visible = true;
  const reset = () => { frames = sc.build(body); i = 0; };
  const step = () => {
    clearTimeout(timer);
    if (!el.isConnected) return;
    if (!visible){ timer = null; return; }
    if (i < frames.length){ const [fn, d] = frames[i++]; fn(); timer = setTimeout(step, d || 1200); }
    else timer = setTimeout(() => { reset(); timer = setTimeout(step, 900); }, 3000);
  };
  reset();
  if (reduce){ frames.forEach(([fn]) => fn()); }
  else {
    timer = setTimeout(step, 900);
    if ("IntersectionObserver" in window){
      new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && !timer) step(); }).observe(el);
    }
  }
  q(el, ".anim-cap button").onclick = () => { clearTimeout(timer); reset(); if (reduce) frames.forEach(([fn]) => fn()); else timer = setTimeout(step, 500); };
}

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rich(s){ // 사용자 글: 이스케이프 → [[단어]] 사전 링크 → 줄바꿈
  return esc(s).replace(/\[\[([^\]\n]{1,30})\]\]/g, (m, w) => `<a class="w" href="${NAVER(w)}" target="_blank" rel="noopener">${w}</a>`).replace(/\n/g, "<br>");
}
function countPh(str){
  const DIPH = new Set([2,3,6,7,9,10,12,14,15,17,19]); // ㅑㅒㅕㅖㅘㅙㅛㅝㅞㅠㅢ
  const CLUSTER = new Set([3,5,6,9,10,11,12,13,14,15,18]);
  let n = 0;
  for (const ch of str){
    const c = ch.codePointAt(0) - 0xAC00;
    if (c < 0 || c > 11171) continue;
    const ini = Math.floor(c/588), med = Math.floor((c%588)/28), fin = c%28;
    if (ini !== 11) n++;
    n += DIPH.has(med) ? 2 : 1;
    if (fin) n += CLUSTER.has(fin) ? 2 : 1;
  }
  return n;
}
function linkWords(root){
  root.querySelectorAll("w").forEach(el => {

    a.title = "네이버 국어사전: " + q;
    a.innerHTML = el.innerHTML;
    el.replaceWith(a);
  });
}

}

function startDemo(){
  const list = PHON.filter(p => p.steps.length >= 2);
  let ex = 0, st = 0;
  const foot = $("#demo-foot");
  foot.innerHTML = list.map((p,i) => `<button data-i="${i}">${esc(p.w)}</button>`).join("");
  foot.onclick = e => { const b = e.target.closest("button"); if (!b) return; ex = +b.dataset.i; st = 0; draw(true); restart(); };
  function draw(swap){
    const p = list[ex], chain = $("#demo-chain");
    if (!chain) return;
    const forms = [p.w, ...p.steps.map(s => s[0])];
    const html = forms.map((f, i) => {
      const last = i === forms.length - 1;
      const cls = "form" + (i === st ? " on" : "") + (last && st === forms.length - 1 ? " final" : "");
      const txt = last ? `[${f}]` : (i === 0 ? `/${f}/` : f);
      const arrow = i < p.steps.length ? `<span class="arrow" style="--tc:${TYPE_COLOR[p.steps[i][2]]}"><i>→</i><small>${esc(p.steps[i][1])}<br>${p.steps[i][2]}</small></span>` : "";
      return `<span class="${cls}">${esc(txt)}</span>${arrow}`;
    }).join("");
    $("#demo-w").textContent = `${p.w} · 음운 ${countPh(p.base||p.w)}개 → ${countPh(forms[forms.length-1])}개`;
    foot.querySelectorAll("button").forEach((b,i) => b.classList.toggle("on", i === ex));
    if (swap){ chain.classList.add("fade"); setTimeout(() => { chain.innerHTML = html; chain.classList.remove("fade"); }, 200); }
    else chain.innerHTML = html;
  }
  function tick(){
    const p = list[ex];
    if (st < p.steps.length){ st++; draw(false); }
    else { ex = (ex + 1) % list.length; st = 0; draw(true); }
  }
  function restart(){ clearInterval(demoTimer); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) demoTimer = setInterval(tick, 1500); }
  st = list[0].steps.length; draw(false); st = 0; setTimeout(() => draw(false), 900); restart();

  hd.addEventListener("input", () => { const q = hd.value.trim(); $("#hd-n").href = q ? NAVER(q) : "https://ko.dict.naver.com/"; $("#hd-s").href = q ? STD(q) : "https://stdict.korean.go.kr/"; });
  hd.addEventListener("keydown", e => { if (e.key === "Enter" && hd.value.trim()) $("#hd-n").click(); });
}

      const list = WORDS.filter(w => f === "전체" || w[1] === f);
      el.innerHTML = `<p style="margin:0 0 8px"><b>파생어·합성어 분류 연습</b> — 단어를 눌러 어떤 짜임인지 확인해 보세요.</p>
        <div class="mtabs" style="margin-bottom:10px">${["전체","단일어","파생어","합성어"].map(t => `<button data-f="${t}" class="${f===t?"on":""}">${t}</button>`).join("")}<button data-all="1">모두 보기</button></div>
        <div class="sent wt">${list.map(([w,t,s]) => `<button data-k="1" style="min-width:auto"><b>${esc(w)}</b><small>${esc(t)}</small><small style="font-weight:500">${esc(s)}</small></button>`).join("")}</div>`;
    };
    el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.f){ f = b.dataset.f; draw(); }
      else if (b.dataset.all) el.querySelectorAll(".sent button").forEach(x => x.classList.add("show"));
      else if (b.dataset.k) b.classList.toggle("show"); };
    draw();
  }
  if (kind === "morph"){
    el.className = "wg"; let cur = 0, mode = "m";
    const draw = () => {
      const x = MORPH[cur];
      let body;
      if (mode === "w") body = `<div class="mrow">${x.words.map(w => `<span class="mc">${esc(w)}</span>`).join("")}</div><p class="muted" style="margin:4px 0">단어 ${x.words.length}개 (조사는 단어, 어미는 앞말에 붙여 한 단어)</p>`;
      else body = `<div class="mrow">${x.m.map(([t,ja,sil,pos]) => { const on = mode==="ja" ? ja : mode==="sil" ? sil : -1;
          const lab = mode==="ja" ? (ja?"자립":"의존") : mode==="sil" ? (sil?"실질":"형식") : pos;
          return `<span class="mc ${on===1?"a":on===0?"b":""}">${esc(t)}<small>${lab}</small></span>`; }).join("")}</div>
          <p class="muted" style="margin:4px 0">형태소 ${x.m.length}개${mode==="ja"?` · 자립 ${x.m.filter(m=>m[1]).length} / 의존 ${x.m.filter(m=>!m[1]).length}`:""}${mode==="sil"?` · 실질 ${x.m.filter(m=>m[2]).length} / 형식 ${x.m.filter(m=>!m[2]).length}`:""}</p>`;
      el.innerHTML = `<div class="wg-pick">${MORPH.map((m,i) => `<button data-i="${i}" class="${i===cur?"on":""}">${esc(m.s)}</button>`).join("")}</div>
        <div class="mtabs">${[["m","형태소로 나누기"],["ja","자립 / 의존"],["sil","실질 / 형식"],["w","단어로 나누기"]].map(([k,l]) => `<button data-m="${k}" class="${mode===k?"on":""}">${l}</button>`).join("")}</div>
        ${body}${x.note ? `<div class="tip">${esc(x.note)}</div>` : ""}`;
    };
    el.onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.i) cur = +b.dataset.i; if (b.dataset.m) mode = b.dataset.m; draw(); };
    draw();
  }
  if (kind === "quiz"){
    const qs = QUIZ[el.dataset.unit] || [];
    el.className = "quiz";
    let order, i, picks, lockd, perms;
    const NUM = ["①","②","③","④","⑤","⑥"];
    const shuffle = arr => { const a = [...arr]; for (let k = a.length - 1; k > 0; k--){ const j = Math.floor(Math.random()*(k+1)); [a[k],a[j]] = [a[j],a[k]]; } return a; };
    const start = (idx) => { order = idx; i = 0; picks = []; lockd = false; perms = idx.map(q => shuffle(qs[q].c.map((_,k) => k))); draw(); };
    // 선택지를 섞은 뒤 문제 p번째 자리의 원래 번호 → 화면 번호로 바꿔 해설 속 ①② 표기를 맞춤
    const view = (pos) => { const x = qs[order[pos]], pm = perms[pos], inv = []; pm.forEach((o,k) => inv[o] = k);
      const e = x.e.replace(/[①-⑤]+/g, run => [...run].map(ch => inv[NUM.indexOf(ch)]).sort((m,n)=>m-n).map(k => NUM[k]).join(""));
      return { q: x.q, c: pm.map(o => x.c[o]), a: inv[x.a], e }; };
    function draw(){
      if (i >= order.length) return result();
      const x = view(i), p = picks[i];
      el.innerHTML = `<div class="qz-top"><span>${i+1} / ${order.length}</span><span class="qz-bar"><i style="width:${(i/order.length)*100}%"></i></span><span>맞힌 문제 ${picks.filter((pk,k)=>pk===view(k).a).length}</span></div>
        <p class="qz-q">${esc(x.q)}</p>
        <div class="qz-c">${x.c.map((c,k) => `<button data-k="${k}" class="${p===undefined?"":k===x.a?"ok":k===p?"no":"dim"}" ${p===undefined?"":"disabled"}><b>${NUM[k]}</b><span>${esc(c)}</span></button>`).join("")}</div>
        ${p===undefined ? "" : `<div class="qz-e ${p===x.a?"ok":"no"}"><b>${p===x.a?"정답이에요!":"아쉬워요. 정답은 "+NUM[x.a]+"이에요."}</b><br>${esc(x.e)}</div>
        <div class="row-actions"><button class="btn primary" data-next="1">${i===order.length-1?"결과 보기":"다음 문제 →"}</button></div>`}`;
    }
    function result(){
      const wrong = order.map((q,k) => [q,picks[k],view(k)]).filter(([q,pk,v]) => pk !== v.a);
      const score = order.length - wrong.length;
      el.innerHTML = `<div class="qz-res"><b>${score} / ${order.length}</b><span>${score===order.length?"완벽해요! 이 단원은 자신 있게 넘어가도 돼요.":score>=order.length*0.7?"잘했어요. 틀린 문제의 개념만 다시 확인해 보세요.":"개념을 한 번 더 읽고 다시 풀어 보세요."}</span></div>
        ${wrong.length ? `<h4>틀린 문제 다시 보기</h4>${wrong.map(([q,pk,v]) => `<div class="qz-w"><p><b>${esc(v.q)}</b></p><p>내 답: ${NUM[pk]} ${esc(v.c[pk])}<br>정답: ${NUM[v.a]} ${esc(v.c[v.a])}</p><p class="muted">${esc(v.e)}</p></div>`).join("")}` : ""}
        <div class="row-actions"><button class="btn primary" data-again="all">순서 섞어서 다시 풀기</button>${wrong.length?`<button class="btn" data-again="wrong">틀린 문제만 다시 풀기</button>`:""}</div>`;
      el.querySelector("[data-again='wrong']")?.addEventListener("click", () => start(shuffle(wrong.map(w => w[0]))));
    }
    el.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.k !== undefined && picks[i] === undefined){ picks[i] = +b.dataset.k; draw(); }
      else if (b.dataset.next){ i++; draw(); el.scrollIntoView({block:"nearest"}); }
      else if (b.dataset.again === "all") start(shuffle(qs.map((_,k) => k)));
    };
    start(qs.map((_,k) => k));
  }
  if (kind === "sent"){
    el.className = "wg"; let cur = 0;
    const draw = () => {
      const x = SENTS[cur];
      el.innerHTML = `<p style="margin:0 0 8px"><b>어절을 눌러 문장 성분을 확인해 보세요.</b></p>
        <div class="wg-pick">${SENTS.map((s,i) => `<button data-i="${i}" class="${i===cur?"on":""}">${i+1}</button>`).join("")}<button data-all="1">모두 보기</button></div>
        <div class="sent">${x.s.map(([t,r],i) => `<button data-k="${i}" aria-label="${esc(t)}"><b>${esc(t)}</b><small>${esc(r)}</small></button>`).join("")}</div>
        <div class="tip">${esc(x.note)}</div>`;
    };
    el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.i){ cur = +b.dataset.i; draw(); }
      else if (b.dataset.all) el.querySelectorAll(".sent button").forEach(x => x.classList.add("show"));
      else if (b.dataset.k) b.classList.toggle("show"); };
    draw();
  }
}

const EXAM_SLUG = {"수능":"suneung","6월 모의평가":"mo6","9월 모의평가":"mo9","3월 학력평가":"hak3","4월 학력평가":"hak4","7월 학력평가":"hak7","10월 학력평가":"hak10","내신":"naesin","기타":"etc"};
// 휴대폰 사진처럼 큰 이미지는 긴 변 2200px, JPEG로 줄여서 올려요 (글씨가 읽힐 정도로 선명하게).
async function compressImage(file){
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.88));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type: "image/jpeg"}) : file;
  } catch(_){ return file; }
}

/* ---------- 정적 사이트(Vercel) 모드 ---------- */
// data.json을 읽어 보여 줘요. 편집 모드에서 고친 내용은
// GitHub에 연결돼 있으면 바로 GitHub에 저장되고(1분 뒤 사이트 반영),
// 연결 전이면 [data.json 내용 복사]로 직접 붙여 넣어요.
const DRAFT_KEY = "madang-draft", EDIT_KEY = "madang-edit", GH_KEY = "madang-gh", SYNCED_KEY = "madang-synced";
const ls = { get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_){} }, del(k){ try { localStorage.removeItem(k); } catch(_){} } };
let ORIGINAL = "", SYNC = null, SYNC_STATE = "";

const GH = {
  cfg(){ try { return JSON.parse(ls.get(GH_KEY) || "null"); } catch(_){ return null; } },
  msg(status){ return ({401:"토큰이 틀렸거나 기간이 끝났어요.",403:"토큰 권한이 부족해요. Contents를 'Read and write'로 설정했는지 확인해 주세요.",404:"저장소를 찾을 수 없어요. 저장소 주소와, 토큰을 만들 때 고른 저장소를 확인해 주세요.",409:"다른 곳에서 동시에 고쳐졌어요. 새로고침한 뒤 다시 시도해 주세요.",422:"다른 곳에서 동시에 고쳐졌어요. 새로고침한 뒤 다시 시도해 주세요."})[status] || `GitHub 오류(${status})가 났어요.`; },
  async api(path, opt = {}, c = GH.cfg()){
    let r;
    try { r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path ? "/" + path : ""}`, {...opt, headers: {Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json", ...(opt.body ? {"Content-Type": "application/json"} : {})}}); }
    catch(_){ throw {message: "인터넷 연결을 확인해 주세요."}; }
    if (!r.ok) throw {status: r.status, message: GH.msg(r.status)};
    return r.status === 204 ? null : r.json();
  },
  enc(p){ return p.split("/").map(encodeURIComponent).join("/"); },
  async sha(p){ const c = GH.cfg(); try { return (await GH.api(`contents/${GH.enc(p)}?ref=${encodeURIComponent(c.branch)}`)).sha; } catch(e){ if (e.status === 404) return null; throw e; } },
  async put(p, b64, message){ const c = GH.cfg(), sha = await GH.sha(p); return GH.api(`contents/${GH.enc(p)}`, {method: "PUT", body: JSON.stringify({message, content: b64, branch: c.branch, ...(sha ? {sha} : {})})}); },
  async putFile(p, blob, message){ const b64 = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = no; fr.readAsDataURL(blob); }); return GH.put(p, b64, message); },
  async putText(p, text, message){ const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return GH.put(p, btoa(bin), message); },
  async delFile(p, message){ const c = GH.cfg(), sha = await GH.sha(p); if (sha) await GH.api(`contents/${GH.enc(p)}`, {method: "DELETE", body: JSON.stringify({message, sha, branch: c.branch})}); }
};

function exportJSON(){
  const clean = x => { const {local, pending, blob, ...r} = x; return r; };
  return JSON.stringify({ gichul: S.gichul.map(g => ({...g, files: (g.files||[]).map(clean)})), notes: S.notes }, null, 2);
}
function syncNow(){
  const json = exportJSON();
  SYNC_STATE = "saving"; drawEditBar();
  const run = (SYNC || Promise.resolve()).catch(() => {}).then(() => GH.putText("data.json", json, "기출 자료 업데이트"))
    .then(() => { ORIGINAL = json; ls.del(DRAFT_KEY); ls.set(SYNCED_KEY, JSON.stringify({t: Date.now(), json})); SYNC_STATE = "saved"; drawEditBar(); })
    .catch(e => { SYNC_STATE = "error:" + (e.message || "저장하지 못했어요."); drawEditBar(); throw e; });
  SYNC = run; return run;
}
function changed(){ ls.set(DRAFT_KEY, exportJSON()); updateDyn(); if (GH.cfg()) syncNow().catch(() => {}); else drawEditBar(); }
const LocalDB = {
  collection(name){ return { add: async d => { const id = name[0] + Date.now().toString(36) + Math.random().toString(36).slice(2,5); S[name] = S[name].concat([{id, ...d}]); changed(); return {id}; } }; },
  doc(path){ const [name, id] = path.split("/"); return {
    set: async d => { S[name] = S[name].filter(x => x.id !== id).concat([{id, ...d}]); changed(); },
    delete: async () => { S[name] = S[name].filter(x => x.id !== id); changed(); } }; }
};
function loadData(d){
  S.gichul = (d.gichul||[]).map((g,k) => ({id: g.id || "g" + k, ...g}));
  S.notes = (d.notes||[]).map((n,k) => ({id: n.id || "n" + k, ...n}));
}
async function startStatic(){
  try {
    const r = await fetch("data.json", {cache: "no-cache"});
    let txt = await r.text();
    // 방금 GitHub에 저장했는데 사이트가 아직 새로 올라가기 전이면, 이 브라우저에 남은 최신본을 보여 줘요.
    try { const s = JSON.parse(ls.get(SYNCED_KEY) || "null"); if (s && Date.now() - s.t < 5*60*1000 && s.json.trim() !== txt.trim()) txt = s.json; } catch(_){}
    ORIGINAL = txt; loadData(JSON.parse(txt)); S.db = "ok";
  } catch(e){ S.db = "error"; }
  if (ls.get(EDIT_KEY) === "1") enterEdit(true);
  updateDyn(); drawEditBar();
  const ft = document.querySelector("footer");
  ft.insertAdjacentHTML("beforeend", `<br><button class="btn small" id="edit-toggle" style="margin-top:10px">${S.canWrite ? "편집 모드 끄기" : "편집 모드"}</button>`);
  $("#edit-toggle").onclick = () => S.canWrite ? leaveEdit() : enterEdit(false);
}
function enterEdit(){
  S.canWrite = true; DB = LocalDB; ls.set(EDIT_KEY, "1");
  const draft = ls.get(DRAFT_KEY);
  if (draft && draft.trim() !== ORIGINAL.trim()){ try { loadData(JSON.parse(draft)); } catch(_){} }
  updateDyn(); drawEditBar();
  const t = $("#edit-toggle"); if (t) t.textContent = "편집 모드 끄기";
}
function leaveEdit(){
  S.canWrite = false; ls.set(EDIT_KEY, "0");
  try { loadData(JSON.parse(ORIGINAL)); } catch(_){}
  updateDyn(); drawEditBar();
  const t = $("#edit-toggle"); if (t) t.textContent = "편집 모드";
}
function isDirty(){ try { return exportJSON().trim() !== JSON.stringify(JSON.parse(ORIGINAL), null, 2).trim(); } catch(_){ return true; } }
function drawEditBar(){
  let bar = $("#editbar");
  if (!S.canWrite){ bar?.remove(); return; }
  if (!bar){ document.body.insertAdjacentHTML("beforeend", `<div id="editbar"></div>`); bar = $("#editbar"); }
  const gh = GH.cfg(), dirty = isDirty();
  let status, actions = "";
  if (gh){
    status = SYNC_STATE === "saving" ? "GitHub에 저장하는 중…" : SYNC_STATE === "saved" ? "GitHub에 저장했어요 · 1분쯤 뒤 사이트에 반영돼요" : SYNC_STATE.startsWith("error:") ? "저장 실패: " + esc(SYNC_STATE.slice(6)) : (dirty ? "저장하지 않은 변경이 있어요" : `GitHub(${esc(gh.repo)})에 연결됨 · 바꾸면 바로 저장돼요`);
    if (SYNC_STATE.startsWith("error:") || (dirty && SYNC_STATE !== "saving")) actions += `<button class="btn small primary" id="eb-retry">다시 저장</button>`;
    actions += `<button class="btn small" id="eb-gh">연결 설정</button>`;
  } else {
    status = dirty ? "GitHub에 아직 반영하지 않은 변경이 있어요" : "변경 사항 없음";
    actions += `<button class="btn small primary" id="eb-gh">GitHub 연결 (사진 자동 저장)</button><button class="btn small" id="eb-copy" ${dirty?"":"disabled"}>data.json 내용 복사</button>${dirty?`<button class="btn small" id="eb-reset">변경 버리기</button>`:""}`;
  }
  bar.innerHTML = `<span><b>편집 모드</b> · ${status}</span><span class="row-actions" style="margin:0">${actions}<button class="btn small" id="eb-off">끄기</button></span>`;
  $("#eb-off").onclick = leaveEdit;
  $("#eb-gh").onclick = openConnect;
  $("#eb-retry")?.addEventListener("click", () => syncNow().catch(() => {}));
  if (!gh && dirty){
    $("#eb-copy").onclick = openPublish;
    $("#eb-reset").onclick = () => { ls.del(DRAFT_KEY); try { loadData(JSON.parse(ORIGINAL)); } catch(_){} updateDyn(); drawEditBar(); };
  }
}
function openConnect(){
  const c = GH.cfg() || {};
  const m = modal(`<h2>GitHub 연결</h2>
  <p class="muted" style="margin-top:0">한 번만 연결해 두면, 기출을 저장할 때 사진과 내용이 GitHub에 바로 올라가요. 연결 정보는 <b>이 브라우저에만</b> 저장돼요.</p>
  <h4 style="margin:14px 0 6px">1. 토큰 만들기 (처음 한 번)</h4>
  <ol class="howto">
    <li>GitHub 오른쪽 위 내 사진 → <b>Settings</b></li>
    <li>왼쪽 메뉴 맨 아래 <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b></li>
    <li><b>Generate new token</b>을 누르고 이름(예: 문법마당)을 적어요. 기간(Expiration)은 1년 정도로 골라요.</li>
    <li><b>Repository access</b>에서 <b>Only select repositories</b> → 이 사이트 저장소를 골라요.</li>
    <li><b>Permissions</b>에서 <b>Contents</b>를 찾아 <b>Read and write</b>로 바꿔요.</li>
    <li>맨 아래 <b>Generate token</b> → <code>github_pat_</code>로 시작하는 글자를 복사해요. (이 화면을 벗어나면 다시 볼 수 없어요)</li>
  </ol>
  <h4 style="margin:14px 0 6px">2. 아래에 붙여 넣기</h4>
  <div class="field"><label for="gh-repo">저장소 주소</label><input id="gh-repo" value="${c.owner ? `https://github.com/${esc(c.owner)}/${esc(c.repo)}` : ""}" placeholder="https://github.com/내아이디/저장소이름"></div>
  <div class="field"><label for="gh-token">토큰</label><input id="gh-token" type="password" value="${esc(c.token||"")}" placeholder="github_pat_…" autocomplete="off"></div>
  <p class="err" id="gh-err"></p>
  <div class="row-actions"><button class="btn primary" id="gh-ok">연결하기</button>${c.token ? `<button class="btn danger" id="gh-off">연결 끊기</button>` : ""}<span class="muted" id="gh-msg" style="font-size:14px"></span></div>
  <div class="tip">토큰은 비밀번호처럼 다른 사람에게 보여 주지 마세요. 공용 컴퓨터에서는 다 쓴 뒤 [연결 끊기]를 눌러 주세요.</div>`);
  $("#gh-off", m)?.addEventListener("click", () => { ls.del(GH_KEY); SYNC_STATE = ""; closeModal(); drawEditBar(); });
  $("#gh-ok", m).onclick = async e => {
    const err = $("#gh-err", m); err.textContent = "";
    const mt = $("#gh-repo", m).value.trim().replace(/\.git$/, "").replace(/\/+$/, "").match(/(?:github\.com\/)?([\w.-]+)\/([\w.-]+)$/);
    const token = $("#gh-token", m).value.trim();
    if (!mt){ err.textContent = "저장소 주소를 확인해 주세요. 예: https://github.com/내아이디/저장소이름"; return; }
    if (!token){ err.textContent = "토큰을 붙여 넣어 주세요."; return; }
    e.target.disabled = true; $("#gh-msg", m).textContent = "확인하는 중…";
    const cfg = {owner: mt[1], repo: mt[2], token};
    try {
      const info = await GH.api("", {}, cfg);
      cfg.branch = info.default_branch || "main";
      await GH.api(`contents/data.json?ref=${encodeURIComponent(cfg.branch)}`, {}, cfg);
      ls.set(GH_KEY, JSON.stringify(cfg)); SYNC_STATE = "";
      closeModal(); drawEditBar();
      if (isDirty()) syncNow().catch(() => {});
    } catch(ex){
      err.textContent = ex.status === 404 ? "저장소나 data.json을 찾지 못했어요. 주소가 맞는지, 토큰을 만들 때 이 저장소를 골랐는지 확인해 주세요." : (ex.message || "연결하지 못했어요.");
      e.target.disabled = false; $("#gh-msg", m).textContent = "";
    }
  };
}
function openPublish(){
  const json = exportJSON();
  const imgs = S.gichul.flatMap(g => (g.files||[]).filter(f => f.local).map(f => f.name));
  const m = modal(`<h2>사이트에 반영하기</h2>
    <ol style="padding-left:20px;line-height:1.9">
      <li>아래 <b>복사하기</b>를 눌러요.</li>
      <li>GitHub 저장소에서 <b>data.json</b> 파일을 열고 오른쪽 위 연필(✏️) 버튼을 눌러요.</li>
      <li>안의 글자를 <b>전부 지우고</b>(Ctrl+A → Delete, 맥은 ⌘+A) 붙여 넣어요.</li>
      <li>초록색 <b>Commit changes</b> 버튼을 두 번 눌러 저장해요. 1분 안에 사이트에 반영돼요.</li>
    </ol>
    ${imgs.length ? `<div class="tip">새 사진 <b>${imgs.map(esc).join(", ")}</b>도 GitHub의 <b>images</b> 폴더에 올려 주세요. (images 폴더 → Add file → Upload files)</div>` : ""}
    <div class="row-actions"><button class="btn primary" id="pb-copy">복사하기</button><span class="muted" id="pb-msg" style="font-size:14px"></span></div>
    <div class="field" style="margin-top:12px"><label for="pb-out">복사할 내용</label><textarea id="pb-out" readonly style="min-height:140px;font-family:monospace;font-size:12.5px">${esc(json)}</textarea></div>
    <div class="row-actions"><button class="btn" id="pb-done">GitHub에 붙여 넣었어요</button></div>`);
  $("#pb-copy", m).onclick = async () => { try { await navigator.clipboard.writeText(json); $("#pb-msg", m).textContent = "복사했어요. 이제 GitHub에 붙여 넣으세요."; } catch(_){ $("#pb-out", m).select(); $("#pb-msg", m).textContent = "아래 글자가 선택됐어요. Ctrl+C로 복사해 주세요."; } };
  $("#pb-done", m).onclick = () => { ORIGINAL = json; ls.del(DRAFT_KEY); closeModal(); drawEditBar(); };
}

</script>
</body>
